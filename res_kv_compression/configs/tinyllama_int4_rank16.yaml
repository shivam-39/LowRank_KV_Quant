experiment:
  name: tinyllama_int4_rank16
  seed: 42

logging:
  wandb: false
  tensorboard: false
  output_dir: logs/tinyllama_int4_rank16
  log_level: INFO

model:
  model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  dtype: float16
  device: auto
  max_seq_len: 2048
  trust_remote_code: false
  use_cache: true

compression:
  rank: 500
  decomposition_type: truncated_svd
  randomized_oversamples: 8
  randomized_n_iter: 2
  adaptive_rank: false
  shared_rank: true
  energy_threshold: 0.99
  granularity: per_head

quantization:
  quant_bits: 4
  group_size: 64
  per_channel: false
  symmetric: true
  fake_quant: true

attention:
  mode: reconstructed
  causal: true
  dropout_p: 0.0

objectives:
  use_attention_loss: true
  use_softmax_loss: true
  use_output_loss: true
  softmax_loss_type: kl
  lambda_recon: 1.0
  lambda_attention: 1.0
  lambda_softmax: 1.0
  lambda_output: 1.0

evaluation:
  perplexity_eval: false
  long_context_eval: false
  latency_eval: false
  memory_eval: true
  generation_memory_eval: false
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: test
  max_eval_samples: 32
  batch_size: 1
  stride: 512
  latency_warmup: 1
  latency_iters: 5
  prompt: "Bicameralism is a type of legislature that is divided into two separate assemblies, chambers, or houses, known as a bicameral legislature. Bicameralism is distinguished from unicameralism, in which all members deliberate and vote as a single group. As of 2022, roughly 40% of the world's national legislatures are bicameral, while unicameralism represents 60% nationally and much more at the subnational level.[1]Often, the members of the two chambers are elected or selected by different methods, which vary from jurisdiction to jurisdiction. This can often lead to the two chambers having very different compositions of members.Enactment of primary legislation often requires a concurrent majority—the approval of a majority of members in each of the chambers of the legislature. When this is the case, the legislature may be called an example of perfect bicameralism. However, in many parliamentary and semi-presidential systems, the house to which the executive is responsible (e.g. House of Commons of the UK and National Assembly of France) can overrule the other house (e.g. House of Lords of the UK and Senate of France) and may be regarded as an example of imperfect bicameralism. Some legislatures lie in between these two positions, with one house able to overrule the other only under certain circumstances. Significance of the British Parliament Main article: Parliament of the United Kingdom The British Parliament is often referred to as the \"Mother of Parliaments\" (in fact a misquotation of John Bright, who remarked in 1865 that \"England is the Mother of Parliaments\") because the British Parliament has been the model for most other parliamentary systems, and its Acts have created many other parliaments.[2] The origins of British bicameralism can be traced to 1341, when the Commons met separately from the nobility and clergy for the first time, creating what was effectively an Upper Chamber and a Lower Chamber, with the knights and burgesses sitting in the latter. This Upper Chamber became known as the House of Lords from 1544 onward, and the Lower Chamber became known as the House of Commons, collectively known as the Houses of Parliament. Debate in the founding of the United States Main article: Federal government of the United States See also: Worldwide influence of the Constitution of the United States The Founding Fathers of the United States also favoured a bicameral legislature. The idea was to have the upper chamber, the Senate, be wealthier and wiser than the lower chamber, the House of Representatives. Benjamin Rush noted, however, that \"this type of dominion is almost always connected with opulence\". The Senate was created to be a stabilising force, not elected by mass electors, but selected by the State legislators. Senators would be more knowledgeable and more deliberate—a sort of republican nobility—and a counter to what James Madison saw as the \"fickleness and passion\" that could absorb the House.[3] He noted further that \"The use of the Senate is to consist in its proceeding with more coolness, with more system and with more wisdom, than the popular branch.\" Madison's argument led the Framers to grant the Senate prerogatives in foreign policy, an area where steadiness, discretion, and caution were deemed especially important.[3] Accordingly, state legislators initially chose the Senate; this lasted until 1913, after which the 17th amendment required Senators be elected by popular vote.[3] As part of the Connecticut Compromise, the Founding Fathers invented a new rationale for bicameralism in the context of federalism. The Senate would have exactly two delegates per state, and the House would have representatives by relative populations. Rise of the Commonwealth See also: Commonwealth of Nations Many monarchies then followed, and to some degree emulated, the British \"three-tier\" model.[4][5] In the 20th century most countries in Europe and the Commonwealth abolished the monarchy, and the upper house. Often a largely ceremonial head of state who formally opens and closes parliament was introduced, a larger house representing the population, and a smaller house mostly representing the regions was established.[6][7][8]  Rationale for bicameralism and criticism A formidable sinister interest may always obtain the complete command of a dominant assembly by some chance and for a moment, and it is therefore of great use to have a second chamber of an opposite sort, differently composed, in which that interest in all likelihood will not rule. Federal states have often adopted it as an awkward compromise between existing power held equally by each state or territory and a more democratic proportional legislature.[9] For states considering a different constitutional arrangement that may shift power to new groupings, bicameralism could be demanded by currently hegemonic groups who would otherwise prevent any structural shift (e.g. military dictatorships, aristocracies). The growing awareness of the complexity of the notion of representation and the multi-functional nature of modern legislatures may be affording incipient new rationales for second chambers, though these do generally remain contested institutions in ways that first chambers are not. An example of political controversy regarding a second chamber has been the debate over the powers of the Senate of Canada or the election of the Senate of France.[10] Bicameral legislatures as a result have been trending down for some time with unicameral, proportional legislatures seen as more democratic and effective.[11] The relationship between the two chambers varies: in some cases, they have equal power, while in others, one chamber (the directly elected lower house with proportional representation[9]) is clearly superior in its powers. The first tends to be the case in federal systems and those with presidential governments. The second tends to be the case in unitary states with parliamentary systems. Two streams of thought exist: critics believe bicameralism makes meaningful political reforms more difficult to achieve and increases the risk of gridlock—particularly in cases where both chambers have similar powers—while proponents argue the merits of the \"checks and balances\" provided by the bicameral model, which they believe help prevent ill-considered legislation. Communication between houses Formal communication between houses is by various methods, including:[12] Sending messages Formal notices, such as of resolutions or the passing of bills, usually done in writing, via the clerk and speaker of each house. Transmission of bills or amendment to bills requiring agreement from the other house. Joint session a plenary session of both houses at the same time and place. Joint committees which may be formed by committees of each house agreeing to join, or by joint resolution of each house. The United States Congress has conference committees to resolve discrepancies between House and Senate versions of a bill, similar to \"Conferences\" in Westminster parliaments. Conferences Conferences of the Houses of the English (later British) Parliament met in the Painted Chamber of the Palace of Westminster.[13] Historically there were two distinct types: \"ordinary\" and \"free\". The British Parliament last held an ordinary conference in 1860—its elaborate procedure yielding to the simpler sending of messages. A free conference resolves a dispute through \"managers\" meeting less formally in private. The last free conference at Westminster was in 1836 on an amendment to the Municipal Corporations Act 1835;[14] the previous one had been in 1740—with not much more success than ordinary conferences, the free type yielded to the greater transparency of messages.[15] In the Parliament of Australia there have been two formal conferences, in 1930 and 1931, but many informal conferences.[12][16] As of 2007 the \"Conference of Managers\" remains the usual procedure for dispute resolution in the Parliament of South Australia.[17] In the Parliament of New South Wales in 2011, the Legislative Assembly requested a free conference with the Legislative Council over a bill on graffiti; after a year the Council refused, describing the mechanism as archaic and inappropriate.[16] The two houses of the Parliament of Canada have also used conferences, but not since 1947 (although they retain the option). In the United States, Australia, Mexico, Brazil, and Nepal for example, each state or province is given the same number of seats in one of the houses of the legislature, despite variance between the populations of the states or provinces. The European Union maintains a somewhat close to bicameral legislative system consisting of the European Parliament, which is elected in elections on the basis of universal suffrage, and the Council of the European Union, which consists of one representative for each government of member countries, who are competent for a relevant field of legislation."
